name: Attest public approval evidence
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged public approval smoke-test PR number
        required: true
        type: string
        default: '1'

permissions: {}

jobs:
  attest:
    if: github.repository_id == '1467202772' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Collect public REST evidence
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
        run: python -I scripts/collect_approval.py --pr="$PR_NUMBER" --main-sha="$GITHUB_SHA"
      - name: Sign the collected bytes
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: approval-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: approval-evidence
          path: approval-evidence.json
          if-no-files-found: error
